[project]
name = "face-finder"
version = "0.1.0"
description = "CLI tool to find images containing a specific person using facial recognition"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "face-recognition>=1.3.0",
    "face-recognition-models @ git+https://github.com/ageitgey/face_recognition_models",
    "setuptools",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "scipy>=1.13.1",
    "mtcnn>=0.1.1",
    "tensorflow>=2.10.0",
]

[project.scripts]
face-finder = "face_finder.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/face_finder"]
